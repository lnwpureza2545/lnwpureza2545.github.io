<script>
const ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');}),{threshold:0.08});
document.querySelectorAll('.reveal').forEach(el=>ro.observe(el));

function openModal(id){const m=document.getElementById(id);m.style.display='flex';setTimeout(()=>m.classList.add('show'),10);document.body.style.overflow='hidden';}
function closeModal(id){const m=document.getElementById(id);m.classList.remove('show');const v=m.querySelector('video');if(v)v.pause();setTimeout(()=>{m.style.display='none';},320);document.body.style.overflow='';}
window.addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay'))closeModal(e.target.id);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal-overlay.show').forEach(m=>closeModal(m.id));closeLbx();}});

function openLbx(src){const lb=document.getElementById('lbx');document.getElementById('lbxImg').src=src;lb.style.display='flex';setTimeout(()=>lb.classList.add('show'),10);}
function closeLbx(){const lb=document.getElementById('lbx');lb.classList.remove('show');setTimeout(()=>lb.style.display='none',260);}

const navToggle=document.getElementById('navToggle');
const navLinksEl=document.getElementById('navLinks');
navToggle.addEventListener('click',()=>{
  const open=navLinksEl.classList.toggle('open');
  navToggle.classList.toggle('open',open);
  navToggle.setAttribute('aria-expanded',open?'true':'false');
});
navLinksEl.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{
  navLinksEl.classList.remove('open');
  navToggle.classList.remove('open');
  navToggle.setAttribute('aria-expanded','false');
}));

const progressBar=document.getElementById('progress');
addEventListener('scroll',()=>{
  const h=document.documentElement,p=h.scrollTop/(h.scrollHeight-h.clientHeight)*100;
  progressBar.style.width=p+'%';
},{passive:true});
